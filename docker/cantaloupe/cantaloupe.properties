http.enabled = true
http.host = 0.0.0.0
http.port = 8182

source.static = HttpSource
HttpSource.lookup_strategy = BasicLookupStrategy
HttpSource.BasicLookupStrategy.url_prefix = http://fedora:8080/fcrepo/rest/
HttpSource.BasicLookupStrategy.url_suffix = /LARGE
HttpSource.BasicLookupStrategy.auth.basic.username = fedoraAdmin
HttpSource.BasicLookupStrategy.auth.basic.secret = fedoraAdmin
endpoint.iiif.3.enabled = true
endpoint.health.enabled = true
