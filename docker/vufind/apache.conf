ServerName localhost

AliasMatch ^/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/(.*)$ /usr/local/vufind/themes/$1/$2/$3
<Directory ~ "^/usr/local/vufind/themes/([0-9a-zA-Z-_]*)/(assets|css|images|js)/">
    Require all granted
    AllowOverride All
</Directory>

<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot /usr/local/vufind/public

    <Directory /usr/local/vufind/public>
        Options FollowSymLinks
        AllowOverride All
        FallbackResource /index.php
        Require all granted
    </Directory>

    SetEnv VUFIND_LOCAL_DIR /usr/local/vufind/local
    SetEnv VUFIND_LOCAL_MODULES DigLib
    SetEnv VUFIND_ENV development

    ProxyPass /iiif/3/ http://cantaloupe:8182/iiif/3/
    ProxyPassReverse /iiif/3/ http://cantaloupe:8182/iiif/3/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
