client_url = "http://localhost:3000"
backend_url = "http://localhost:9000"
session_key = "replace-this-for-any-non-local-use"

fedora_username = "fedoraAdmin"
fedora_password = "fedoraAdmin"
fedora_pid_namespace = "vudl"
fedora_initial_pid = "0"
base_url = "http://fedora:8080/fcrepo/rest"

tesseract_path = "/usr/bin/tesseract"
ocrmypdf_path = "/usr/bin/ocrmypdf"
ffmpeg_path = "/usr/bin/ffmpeg"
pdf_directory = "/tmp/"
holding_area_path = "/data/holding"
processed_area_path = "/data/processed"
solr_url = "http://solr:8983/solr"
solr_core = "biblio"
vufind_url = "http://vufind:8081"
iiif_internal_origin = "http://cantaloupe:8182"
tika_path = "/usr/local/lib/tika-app.jar"

allowed_origins[] = http://localhost:3000
allowed_origins[] = http://localhost:9000

[Authentication]
strategy = local
hash_algorithm = sha1
salt = "change-this-for-any-non-local-use"
require_passwords = true

[Authentication.initial_users]
admin = change-me-now

[Database]
client = sqlite3

[Database.connection]
filename = "/data/auth.sqlite3"

[queue.connection]
host = redis
port = 6379

